<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>MakinaLabs intro ad</title>
<style>
@font-face{font-family:BC;font-weight:700;src:url(../../../../www/fonts/barlow-condensed-latin-700-normal.woff2)}
@font-face{font-family:BC;font-weight:600;src:url(../../../../www/fonts/barlow-condensed-latin-600-normal.woff2)}
@font-face{font-family:B;font-weight:500;src:url(../../../../www/fonts/barlow-latin-500-normal.woff2)}
@font-face{font-family:B;font-weight:600;src:url(../../../../www/fonts/barlow-latin-600-normal.woff2)}
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1350px;overflow:hidden}
body{position:relative;color:#fff;font-family:B,sans-serif;background:radial-gradient(900px 620px at 88% 2%,rgba(47,196,178,.34),transparent 70%),radial-gradient(800px 700px at 0% 100%,rgba(30,159,214,.3),transparent 70%),linear-gradient(170deg,#06222f,#04131c 62%,#031018)}
.grid{position:absolute;inset:0;opacity:.5;background-image:linear-gradient(rgba(120,220,230,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(120,220,230,.06) 1px,transparent 1px);background-size:54px 54px}
.wrap{position:relative;height:100%;padding:52px 58px 46px;display:flex;flex-direction:column}
.logo{height:66px;align-self:flex-start;display:block}
.eyebrow{margin:30px 0 8px;font:600 27px BC;letter-spacing:.2em;color:#5FE0CF;text-transform:uppercase}
h1{margin:0;font:700 98px/1 BC;letter-spacing:.005em;text-transform:uppercase;white-space:nowrap}
h1 b{font-weight:700;color:#E6B34D}
.sub{margin:16px 0 28px;font:500 30px/1.25 B;color:#dcedf0;white-space:nowrap}
.shot{position:relative;border-radius:20px;padding:6px;background:linear-gradient(140deg,#5FE0CF,#1E9FD6 45%,#E6B34D);box-shadow:0 26px 60px rgba(0,0,0,.55)}
.shot img{display:block;width:100%;border-radius:15px}
.progs{margin:26px 0 0;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center}
.progs img{width:112px;height:112px;object-fit:contain;display:block;margin:0 auto 6px}
.progs span{display:block;font:600 24px/1.06 BC;letter-spacing:.02em;color:#eef6f6}
.foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}
.cta{padding:18px 34px;border-radius:99px;background:linear-gradient(180deg,#8ff5e8,#2bc6b6);color:#04272a;font:700 38px BC;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.url{font:600 37px BC;letter-spacing:.03em;color:#fff;white-space:nowrap}
</style></head><body><div class="grid"></div><div class="wrap">
<img class="logo" src="../../../makinalabs-wordmark-white.svg" alt="">
<p class="eyebrow">Software for marine engineers</p>
<h1>We write the software.<br><b>You stand the watch.</b></h1>
<p class="sub">Apps and simulators built by a chief engineer, for every marine engineer.</p>
<div class="shot"><img src="dashboard.png" alt=""></div>
<div class="progs">
 <div><img src="../../../3d/tank-chief-3d.png" alt=""><span>Tank Chief</span></div>
 <div><img src="../../../3d/voyage-chief-3d.png" alt=""><span>Voyage Chief</span></div>
 <div><img src="../../../3d/cheng-suite-3d.png" alt=""><span>Cheng Suite</span></div>
 <div><img src="../../../3d/purifier-simulator-3d.png" alt=""><span>Purifier Simulator</span></div>
 <div><img src="../../../3d/fwg-simulator-3d.png" alt=""><span>FWG Simulator</span></div>
</div>
<div class="foot"><span class="cta">Follow MakinaLabs</span><span class="url">makinalabs.net</span></div>
</div></body></html>
